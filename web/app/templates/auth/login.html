{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block contenedor %}login-wrap{% endblock %}
{% block content %}
<div class="card login-card shadow-lg">
  <div class="card-body p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-broadcast-pin text-telecom" style="font-size: 3rem;"></i>
      <h1 class="h4 mt-2 mb-0">Activos Fijos Telecom</h1>
      <small class="text-muted">{{ EMPRESA }}</small>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input name="username" class="form-control" required autofocus value="{{ request.form.get('username', '') }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input name="password" type="password" class="form-control" required>
        </div>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="recordar" id="recordar">
        <label class="form-check-label" for="recordar">Recordarme</label>
      </div>
      <button class="btn btn-telecom w-100 py-2"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
