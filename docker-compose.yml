services:
  db:
    image: postgres:16-alpine
    container_name: activos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-activos_telecom}
      POSTGRES_USER: ${POSTGRES_USER:-activos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-activos_pass}
      TZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-activos} -d ${POSTGRES_DB:-activos_telecom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    container_name: activos_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-activos}:${POSTGRES_PASSWORD:-activos_pass}@db:5432/${POSTGRES_DB:-activos_telecom}
      SECRET_KEY: ${SECRET_KEY:-cambie-esta-clave-secreta}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EMPRESA_NOMBRE: ${EMPRESA_NOMBRE:-Empresa de Telecomunicaciones S.A.S.}
      SEED_DEMO: ${SEED_DEMO:-true}
      TZ: America/Bogota
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"

volumes:
  pgdata:
  uploads:
